provider: zhipu

retry:
  attempts: 3
  backoff_seconds: 1.5

mock:
  default_score: 60
  confidence: 0.4
  tags:
    - 待验证
    - 初筛

openai_compatible:
  api_key_env: MODEL_API_KEY
  model: YOUR_MODEL_NAME
  base_url: https://api.openai.com
  timeout_seconds: 60
  temperature: 0

qwen:
  api_key_env: QWEN_API_KEY
  model: qwen-turbo
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  timeout_seconds: 60
  temperature: 0

zhipu:
  api_key_env: ZHIPU_API_KEY
  model: glm-4.7
  base_url: https://open.bigmodel.cn/api/paas/v4/
  timeout_seconds: 180
  temperature: 0
